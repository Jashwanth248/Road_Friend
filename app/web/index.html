<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RoadMate AI</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#0b1020;color:#eef3ff}.wrap{max-width:960px;margin:auto;padding:24px}.card{background:#151c33;border:1px solid #293353;border-radius:18px;padding:20px}.row{display:flex;gap:10px;flex-wrap:wrap}.chat{height:430px;overflow:auto;background:#0e1528;border-radius:14px;padding:14px;margin:16px 0}.m{margin:10px 0;padding:10px 12px;border-radius:12px;background:#1d2847}.u{background:#243b6b}input{flex:1;min-width:240px;padding:14px;border-radius:12px;border:0}button{padding:12px 16px;border-radius:12px;border:0;cursor:pointer;font-weight:650}.primary{background:#79a7ff;color:#081126}.mic.active{background:#ff7f7f;color:#241010}.status{opacity:.86;font-size:14px}.badge{display:inline-block;padding:5px 9px;border:1px solid #47577f;border-radius:99px;margin:3px}.location{margin-top:12px;padding:10px 12px;border:1px solid #34446c;border-radius:12px}.ok{color:#8fe3ad}.warn{color:#ffd788}@media(max-width:640px){.wrap{padding:12px}.chat{height:52vh}.row button{flex:1}}
</style>
</head>
<body><div class="wrap">
<h1>RoadMate AI</h1><p>Real-time voice + text location assistant</p>
<div><span class="badge">Live Location</span><span class="badge">Google Places</span><span class="badge">Traffic Routes</span><span class="badge">Music</span><span class="badge">RAG</span></div>
<div class="card">
  <div id="status" class="status">Connecting…</div>
  <div class="location"><strong>Location:</strong> <span id="locText" class="warn">Not shared</span> <button class="primary" id="locBtn" onclick="enableLocation()">Enable Location</button></div>
  <div id="chat" class="chat"></div>
  <div class="row"><input id="msg" placeholder="Ask: show me the best coffee near me"/><button onclick="sendText()">Send</button><button id="micBtn" class="mic" onclick="toggleListen()">🎤 Talk</button></div>
  <p class="status">For best voice recognition on Mac, use current Chrome. Location updates continuously while this page is open. Road-awareness features are advisory only.</p>
</div></div>
<script>
let ws=null, coords=null, locationWatch=null, recognition=null, listening=false, aiSpeaking=false;
const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
const statusEl=document.getElementById('status'), chatEl=document.getElementById('chat'), msgEl=document.getElementById('msg'), locText=document.getElementById('locText'), micBtn=document.getElementById('micBtn');
function connect(){ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/assistant`);ws.onopen=()=>statusEl.textContent='Connected';ws.onmessage=e=>{const r=JSON.parse(e.data);add(r.text,'a');if(r.speak)speak(r.text);};ws.onclose=()=>{statusEl.textContent='Reconnecting…';setTimeout(connect,1000)}}
function add(t,c){const d=document.createElement('div');d.className='m '+(c==='u'?'u':'');d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}
function sendText(){const t=msgEl.value.trim();if(!t)return;if(!ws||ws.readyState!==WebSocket.OPEN){add('Still connecting. Try again in a moment.','a');return}add(t,'u');ws.send(JSON.stringify({message:t,location:coords,session_id:sessionId}));msgEl.value=''}
msgEl.addEventListener('keydown',e=>{if(e.key==='Enter')sendText()});
function enableLocation(){if(!navigator.geolocation){add('This browser does not support location services.','a');return}locText.textContent='Requesting permission…';navigator.geolocation.getCurrentPosition(p=>{setCoords(p);startLocationWatch();add('Location enabled. I can now search and route from your current position.','a')},err=>{locText.textContent='Permission denied/unavailable';add(`Location error: ${err.message}. Allow location for localhost in your browser settings and try again.`,'a')},{enableHighAccuracy:true,timeout:10000,maximumAge:5000})}
function setCoords(p){coords={latitude:p.coords.latitude,longitude:p.coords.longitude};locText.textContent=`${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)} · ±${Math.round(p.coords.accuracy)}m`;locText.className='ok'}
function startLocationWatch(){if(locationWatch!==null)return;locationWatch=navigator.geolocation.watchPosition(setCoords,()=>{},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function makeRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=3;r.onstart=()=>{listening=true;micBtn.classList.add('active');micBtn.textContent='■ Listening';statusEl.textContent='Listening…'};r.onresult=e=>{let finalText='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}msgEl.value=(finalText||interim).trim();if(finalText.trim())sendText()};r.onerror=e=>{if(e.error!=='no-speech')add(`Voice recognition: ${e.error}. Chrome generally provides the best support on Mac.`,'a')};r.onend=()=>{listening=false;micBtn.classList.remove('active');micBtn.textContent='🎤 Talk';statusEl.textContent='Connected'};return r}
function toggleListen(){if(aiSpeaking){speechSynthesis.cancel();aiSpeaking=false}if(!recognition)recognition=makeRecognition();if(!recognition){add('Speech recognition is unavailable in this browser. Try current Chrome on Mac.','a');return}if(listening){recognition.stop();return}try{recognition.start()}catch(e){}}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.02;u.pitch=1;u.volume=1;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/Samantha|Google US English|Alex/i.test(v.name)&&/^en/i.test(v.lang))||voices.find(v=>/^en-US/i.test(v.lang));if(preferred)u.voice=preferred;u.onstart=()=>{aiSpeaking=true;statusEl.textContent='RoadMate speaking…'};u.onend=()=>{aiSpeaking=false;statusEl.textContent='Connected'};speechSynthesis.speak(u)}
connect();add('Hi! Click Enable Location first. Then ask me for coffee, food, parks, waterfalls, or another nearby place.','a');
</script></body></html>
